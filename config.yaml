gateway:
  port: 10240
  access_keys: []
  key_cooldown_seconds: 120
  session_ttl_seconds: 1800
  max_failover_retries: 3
  upstream_timeout_seconds: 120
  routing_mode: primary_backup
  aggregate_enabled: true
services:
- name: context7
  upstream_url: https://mcp.context7.com/mcp
  enabled: true
  key_auth:
    enabled: true
    type: header
    param: CONTEXT7_API_KEY
  keys: []
  failure_patterns:
  - rate limit
  - quota
  - unauthorized
  - invalid api key
  provider: ''
- name: tavily
  upstream_url: https://mcp.tavily.com/mcp/
  enabled: true
  key_auth:
    enabled: true
    type: query
    param: tavilyApiKey
  keys: []
  failure_patterns:
  - '401'
  - '429'
  - '432'
  - '433'
  - missing or invalid api key
  - excessive requests
  - exceeds your plan's set usage limit
  - exceeds the pay-as-you-go limit
  - upgrade your plan
  - usage limit
  provider: ''
- name: serper
  upstream_url: native://serper
  enabled: true
  key_auth:
    enabled: true
    type: header
    param: X-API-KEY
  keys: []
  failure_patterns:
  - '401'
  - '403'
  - '429'
  - unauthorized
  - invalid api key
  - not enough credits
  - insufficient credits
  - credits exhausted
  - out of credits
  - rate limit
  - too many requests
  provider: serper
