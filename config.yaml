gateway:
  port: 10240
  access_keys: []
  key_cooldown_seconds: 120
  session_ttl_seconds: 1800
  max_failover_retries: 3
  upstream_timeout_seconds: 120
  routing_mode: primary_backup
  aggregate_enabled: false
services:
- name: context7
  upstream_url: https://mcp.context7.com/mcp
  enabled: true
  key_auth:
    enabled: true
    type: header
    param: CONTEXT7_API_KEY
  keys: []
  failure_patterns:
  - rate limit
  - quota
  - unauthorized
  - invalid api key
- name: tavily
  upstream_url: https://mcp.tavily.com/mcp/
  enabled: true
  key_auth:
    enabled: true
    type: query
    param: tavilyApiKey
  keys: []
  failure_patterns:
  - '401'
  - '429'
  - '432'
  - '433'
  - missing or invalid api key
  - excessive requests
  - exceeds your plan's set usage limit
  - exceeds the pay-as-you-go limit
  - upgrade your plan
  - usage limit
# 原生服务：serper.dev 无官方托管 MCP 端点，网关内置 MCP 适配层，
# 把 tools/call 翻译为 serper REST（X-API-KEY 注入）。
# 客户端访问：http://127.0.0.1:10240/serper（一键聚合时为 /mcp 下的 serper_* 工具）。
- name: serper
  provider: serper
  upstream_url: native://serper
  enabled: true
  key_auth:
    enabled: true
    type: header
    param: X-API-KEY
  keys: []
  failure_patterns:
  - '401'
  - '403'
  - '429'
  - unauthorized
  - invalid api key
  - not enough credits
  - insufficient credits
  - credits exhausted
  - out of credits
  - rate limit
  - too many requests
